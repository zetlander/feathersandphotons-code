<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Viewer Feedback - Astra & Wing</title>
</head>
<body>
  <!-- Netlify Forms build-time static skeleton for TanStack Start SSR detection -->
  <form name="feedback" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="feedback" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="text" name="location" />
    <input type="text" name="category" />
    <input type="text" name="targetPhoto" />
    <input type="text" name="rating" />
    <textarea name="message"></textarea>
    <input name="bot-field" />
  </form>
</body>
</html>
